{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h2 class="title">Forgot Password</h2>
        <p class="subtitle">Don't worry, we'll send you an email to reset your password.</p>
        <!-- Add the correct form id and action method -->
        <form id="forgot-password-form" method="POST">
            {% csrf_token %}
            <!-- Add a label for accessibility and correct the form action -->
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter Your Email"
                required
                class="input-field"
            />
            <button type="submit" class="reset-btn">Reset Password</button>
        </form>
        <p class="footer-text">
            Go back to admin login? 
            <a href="{% url 'admin_login' %}" class="link">Click here</a>
        </p>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/forgot_password.js' %}"></script>
{% endblock %}
